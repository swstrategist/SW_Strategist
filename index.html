    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Plus Jakarta Sans', 'sans-serif'],
                    },
                    colors: {
                        swgt: {
                            gold: '#fbbf24',
                            dark: '#0b0f19',
                            card: '#111827',
                        }
                    }
                }
            }
        }

    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #080c14;
            color: #f1f5f9;
        }

        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #0f172a;
        }
        ::-webkit-scrollbar-thumb {
            background: #334155;
            border-radius: 4px;
        }

        .monster-card-avatar {
            position: relative;
            width: 38px;
            height: 38px;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.4);
            background: #1e293b;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid rgba(255, 255, 255, 0.15);
            flex-shrink: 0;
        }

        .monster-card-avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }


        .autocomplete-dropdown {
            max-height: 180px;
            overflow-y: auto;
            z-index: 50;
            color: #000000 !important;
            background-color: #ffffff !important;
        }
    </style>
</head>
<body class="min-h-screen text-slate-100 flex flex-col">

    <!-- En-tête -->
    <header class="border-b border-slate-800 bg-slate-900/90 backdrop-blur sticky top-0 z-40">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <img src="https://i.imgur.com/3FQVVBq.png" alt="Logo" class="w-14 h-14 rounded-xl object-cover shadow-lg">
                <div>
                    <h1 class="font-bold text-base text-white leading-tight">SW Strategist</h1>
                    <p class="text-[11px] text-slate-400 font-medium">Compte-Rendu Siège</p>
                </div>
            </div>
            <div class="flex items-center gap-3">
                <button onclick="resetAllData()" class="px-3 py-1.5 bg-rose-600/20 hover:bg-rose-600/30 text-rose-400 text-xs font-bold rounded-xl border border-rose-500/30 transition flex items-center gap-1.5">
                    <i class="fa-solid fa-trash-can"></i>
                    <span>Effacer Tout</span>
                </button>
                <button onclick="exportAsPNG()" class="px-4 py-1.5 bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-bold rounded-xl shadow-lg transition flex items-center gap-2">
                    <i class="fa-solid fa-file-image"></i>
                    <span>Télécharger PNG</span>
                </button>
            </div>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 my-6 flex-1 w-full space-y-6">
        
        <!-- SECTION 1 : ÉDITEUR DU COMBAT (HAUT) -->
        <div id="panel-editor" class="bg-slate-900 border border-slate-800 rounded-2xl p-5 shadow-xl space-y-4">
            
            <!-- Noms des Guildes & Score -->
            <div class="grid grid-cols-1 md:grid-cols-12 gap-4 items-center">
                <div class="md:col-span-8 grid grid-cols-1 sm:grid-cols-2 gap-3">
                    <div>
                        <label for="guild-name-1-input" class="text-[11px] text-amber-400 font-bold mb-1 flex items-center gap-1">
                            <i class="fa-solid fa-shield"></i> Guilde Adverse 1
                        </label>
                        <input type="text" id="guild-name-1-input" placeholder="Nom Guilde 1..." oninput="onGuildInput()" class="w-full px-3 py-1.5 rounded-xl border border-slate-300 text-xs font-bold text-black focus:outline-none focus:ring-2 focus:ring-amber-500">
                    </div>
                    <div>
                        <label for="guild-name-2-input" class="text-[11px] text-amber-400 font-bold mb-1 flex items-center gap-1">
                            <i class="fa-solid fa-shield"></i> Guilde Adverse 2

                        <input type="text" id="guild-name-2-input" placeholder="Nom Guilde 2..." oninput="onGuildInput()" class="w-full px-3 py-1.5 rounded-xl border border-slate-300 text-xs font-bold text-black focus:outline-none focus:ring-2 focus:ring-amber-500">

            </div>

            <!-- Pastilles de sélection des 10 combats -->

                        Édition Combat <span id="current-battle-title" class="ml-1 text-slate-400">#1</span>

        let battlesData = Array.from({ length: 10 }, (_, i) => ({
            id: i + 1,
            result: 'win',
            offense: ['', '', ''],
            defense: ['', '', '']
        }));

        let currentBattleIndex = 0;
        let guildName1 = '';
        let guildName2 = '';

        function init() {
            renderPills();
            renderEditorForm();
            renderReportCards();
            updateScoreBadge();
            updateGuildDisplay();
        }

        function onGuildInput() {
            guildName1 = document.getElementById('guild-name-1-input').value;
            guildName2 = document.getElementById('guild-name-2-input').value;
            updateGuildDisplay();
        }

        function updateGuildDisplay() {
            requestRender();
        }

        function renderPills() {
            const container = document.getElementById('pills-container');
            container.innerHTML = '';
            battlesData.forEach((b, idx) => {
                const isSelected = idx === currentBattleIndex;
                const btn = document.createElement('button');
                btn.onclick = () => selectBattle(idx);
                btn.className = `py-1 rounded-lg text-xs font-bold transition border ${

                        ? 'bg-amber-500 text-slate-950 border-amber-400 shadow scale-105 z-10'

                }`;
                btn.innerText = `#${b.id}`;
                container.appendChild(btn);
            });
        }

        function selectBattle(index) {
            currentBattleIndex = index;
            renderPills();
            renderEditorForm();
        }

        function setResult(res) {
            battlesData[currentBattleIndex].result = res;
            renderPills();
            renderEditorForm();
            renderReportCards();

        function renderEditorForm() {
            const b = battlesData[currentBattleIndex];
            document.getElementById('current-battle-num').innerText = b.id;
            document.getElementById('current-battle-title').innerText = `#${b.id}`;

            const lossBtn = document.getElementById('btn-res-loss');

            if (b.result === 'win') {
                winBtn.className = "px-3 py-1 rounded-lg text-xs font-bold bg-emerald-600 text-white shadow";

                winBtn.className = "px-3 py-1 rounded-lg text-xs font-bold text-slate-400 hover:text-white";

            }

            renderTeamInputs('offense-monsters-form', 'offense', b.offense);
            renderTeamInputs('defense-monsters-form', 'defense', b.defense);
        }

        function renderTeamInputs(containerId, teamType, monstersArr) {
            const container = document.getElementById(containerId);
            container.innerHTML = '';

            monstersArr.forEach((mName, slotIdx) => {
                const wrapper = document.createElement('div');
                wrapper.className = 'relative flex items-center gap-2';

                const mObj = LOCAL_MONSTER_DATABASE.find(m => m.name.toLowerCase() === mName.toLowerCase());
                const imgUrl = mObj ? mObj.img : 'https://i.imgur.com/zobLe0B.png';

                wrapper.innerHTML = `
                    <div class="monster-card-avatar">
                        <img src="${imgUrl}" alt="${mName}">
                    </div>
                    <div class="relative flex-1">
                        <input type="text" 
                            value="${mName}" 
                            placeholder="Monstre ${slotIdx + 1}"
                            class="w-full px-3 py-1.5 rounded-xl border border-slate-300 text-xs text-black font-semibold focus:outline-none focus:ring-2 focus:ring-amber-500">
                        <div class="autocomplete-dropdown hidden absolute left-0 right-0 top-full mt-1 bg-white border border-slate-300 rounded-xl shadow-xl z-50"></div>
                    </div>
                `;

                const inputEl = wrapper.querySelector('input');
                const dropdownEl = wrapper.querySelector('.autocomplete-dropdown');

                inputEl.oninput = (e) => onMonsterInput(e.target.value, teamType, slotIdx, dropdownEl);

                container.appendChild(wrapper);
            });
        }

        function onMonsterInput(val, teamType, slotIdx, dropdown) {
            battlesData[currentBattleIndex][teamType][slotIdx] = val;

            if (!val.trim()) {
                dropdown.classList.add('hidden');
                renderReportCards();
                return;
            }

            const matches = LOCAL_MONSTER_DATABASE.filter(m => m.name.toLowerCase().includes(val.toLowerCase())).slice(0, 5);

            if (matches.length === 0) {
                dropdown.classList.add('hidden');
            } else {
                dropdown.innerHTML = '';
                matches.forEach(m => {
                    const item = document.createElement('div');
                    item.className = 'px-3 py-1.5 hover:bg-slate-100 cursor-pointer flex items-center gap-2 text-xs font-bold text-black border-b border-slate-100 last:border-0';
                    item.innerHTML = `<img src="${m.img}" class="w-5 h-5 rounded object-cover"><span>${m.name}</span>`;
                    item.onclick = () => {
                        battlesData[currentBattleIndex][teamType][slotIdx] = m.name;
                        renderEditorForm();
                        renderReportCards();
                    };
                    dropdown.appendChild(item);
                });
                dropdown.classList.remove('hidden');
            }

            renderReportCards();

        /* =====================================================================
           RENDU DU COMPTE-RENDU (canvas)
           L'aperçu ET le PNG téléchargé viennent du même dessin : ce que tu vois
           est exactement ce que tu exportes, sans décalage de texte.
           ===================================================================== */
        const REPORT = { W: 1136, SCALE: 2, PAD: 22, GAP: 10, COLS: 5, HEADER_H: 91 };
        const FONT = '"Plus Jakarta Sans", "Segoe UI", Arial, sans-serif';
        const FA_FONT = '"Font Awesome 6 Free"';
        const FA_KHANDA = '\uf666';
        const LOGO_URL = 'https://i.imgur.com/3FQVVBq.png';

        const COLORS = {
            bg: '#0b0f19', dot: '#1e293b', border: '#1e293b',
            slate950: '#020617', slate900: '#0f172a', slate800: '#1e293b', slate700: '#334155',
            slate600: '#475569', slate500: '#64748b', slate400: '#94a3b8', slate200: '#e2e8f0',
            amber: '#fbbf24', white: '#ffffff',
            win: '#34d399', winRgb: '16,185,129',
            loss: '#fb7185', lossRgb: '244,63,94'
        };

        /* ---------- Images (chargées avec CORS pour pouvoir exporter) ---------- */
        const imageCache = new Map();

        function getImage(url) {
            if (!url) return null;
            let entry = imageCache.get(url);
            if (!entry) {
                const img = new Image();
                img.crossOrigin = 'anonymous';
                entry = { img, state: 'loading' };
                entry.promise = new Promise(resolve => {
                    img.onload = () => { entry.state = 'ok'; resolve(); requestRender(); };
                    img.onerror = () => { entry.state = 'error'; resolve(); requestRender(); };
                });
                img.src = url;
                imageCache.set(url, entry);
            }
            return entry;
        }

        function waitForImages() {
            return Promise.all([...imageCache.values()].map(e => e.promise));
        }

        async function loadFonts() {
            try {
                await Promise.all([
                    document.fonts.load('700 10px "Plus Jakarta Sans"', 'AaÈè#?-'),
                    document.fonts.load('800 10px "Plus Jakarta Sans"', 'AaÈè#?-'),
                    document.fonts.load('900 10px "Plus Jakarta Sans"', 'AaÈè#?-'),
                    document.fonts.load('900 12px ' + FA_FONT, FA_KHANDA)
                ]);
            } catch (e) { /* on dessine quand même avec les polices de secours */ }
        }

        /* ---------- Petits outils de dessin ---------- */
        function roundRect(ctx, x, y, w, h, r) {
            ctx.beginPath();
            ctx.moveTo(x + r, y);
            ctx.arcTo(x + w, y, x + w, y + h, r);
            ctx.arcTo(x + w, y + h, x, y + h, r);
            ctx.arcTo(x, y + h, x, y, r);
            ctx.arcTo(x, y, x + w, y, r);
            ctx.closePath();
        }

        function fillStrokeRect(ctx, x, y, w, h, r, fill, stroke) {
            roundRect(ctx, x + 0.5, y + 0.5, w - 1, h - 1, r);
            if (fill) { ctx.fillStyle = fill; ctx.fill(); }
            if (stroke) { ctx.lineWidth = 1; ctx.strokeStyle = stroke; ctx.stroke(); }
        }

        function measureText(ctx, s, o) {
            ctx.font = `${o.weight || 700} ${o.size}px ${o.family || FONT}`;
            const sp = o.spacing || 0;
            if (!sp) return ctx.measureText(s).width;
            return [...s].reduce((a, c) => a + ctx.measureText(c).width + sp, 0) - sp;
        }

        /* Texte centré verticalement sur `cy` d'après la hauteur des capitales :
           le texte est donc pile au milieu de sa boîte, quelle que soit la police. */
        function drawText(ctx, s, x, cy, o) {
            const w = measureText(ctx, s, o);
            const sp = o.spacing || 0;
            ctx.font = `${o.weight || 700} ${o.size}px ${o.family || FONT}`;
            ctx.fillStyle = o.color;
            ctx.textAlign = 'left';
            ctx.textBaseline = 'alphabetic';
            const cap = ctx.measureText('H').actualBoundingBoxAscent || o.size * 0.7;
            const baseline = cy + cap / 2;
            let sx = o.align === 'center' ? x - w / 2 : o.align === 'right' ? x - w : x;
            if (!sp) {
                ctx.fillText(s, sx, baseline);
            } else {
                for (const c of s) { ctx.fillText(c, sx, baseline); sx += ctx.measureText(c).width + sp; }
            }
            return w;
        }

        function drawCover(ctx, img, x, y, size) {
            const iw = img.naturalWidth, ih = img.naturalHeight;
            if (!iw || !ih) return;
            const s = Math.min(iw, ih);
            ctx.drawImage(img, (iw - s) / 2, (ih - s) / 2, s, s, x, y, size, size);
        }

        function wrapName(ctx, name, maxW) {
            ctx.font = `700 9px ${FONT}`;
            const lines = [];
            let cur = '';
            for (const raw of name.split(/\s+/).filter(Boolean)) {
                let word = raw;
                while (ctx.measureText(word).width > maxW && word.length > 1) {
                    let i = word.length;
                    while (i > 1 && ctx.measureText(word.slice(0, i)).width > maxW) i--;
                    if (cur) { lines.push(cur); cur = ''; }
                    lines.push(word.slice(0, i));
                    word = word.slice(i);
                }
                const test = cur ? cur + ' ' + word : word;
                if (ctx.measureText(test).width <= maxW) cur = test;
                else { lines.push(cur); cur = word; }
            }
            if (cur) lines.push(cur);
            return lines;
        }

        /* ---------- Dessin d'un monstre (icône + nom) ---------- */
        function drawMonster(ctx, name, lines, cx, iconY, namesTop, LH) {
            const size = 32, x = cx - size / 2;
            const mObj = name ? LOCAL_MONSTER_DATABASE.find(m => m.name.toLowerCase() === name.toLowerCase()) : null;

            if (!name) {
                fillStrokeRect(ctx, x, iconY, size, size, 8, 'rgba(30,41,59,0.6)', 'rgba(51,65,85,0.5)');
                drawText(ctx, '?', cx, iconY + size / 2, { size: 10, weight: 700, color: COLORS.slate600, align: 'center' });
                drawText(ctx, '-', cx, namesTop + LH / 2, { size: 9, weight: 700, color: COLORS.slate600, align: 'center' });
                return;
            }

            fillStrokeRect(ctx, x, iconY, size, size, 8, COLORS.slate800, null);
            const entry = mObj ? getImage(mObj.img) : null;
            if (entry && entry.state === 'ok') {
                ctx.save();
                roundRect(ctx, x, iconY, size, size, 8);
                ctx.clip();
                drawCover(ctx, entry.img, x, iconY, size);
                ctx.restore();
            } else if (!entry || entry.state === 'error') {
                drawText(ctx, name.charAt(0).toUpperCase(), cx, iconY + size / 2, { size: 13, weight: 800, color: COLORS.slate400, align: 'center' });
            }
            fillStrokeRect(ctx, x, iconY, size, size, 8, null, COLORS.slate700);

            lines.forEach((line, j) => {
                drawText(ctx, line, cx, namesTop + j * LH + LH / 2, { size: 9, weight: 700, color: COLORS.slate200, align: 'center' });
            });
        }

        function drawTeam(ctx, label, names, lines, bx, by, bw, bh, LH) {
            fillStrokeRect(ctx, bx, by, bw, bh, 8, 'rgba(2,6,23,0.6)', 'rgba(30,41,59,0.8)');
            drawText(ctx, label, bx + 9, by + 14, { size: 9, weight: 900, color: COLORS.amber, spacing: 0.45 });
            const centerX = bx + bw / 2;
            const iconY = by + 28;
            const namesTop = iconY + 32 + 4;
            names.forEach((n, k) => {
                drawMonster(ctx, (n || '').trim(), lines[k], centerX + (k - 1) * 62, iconY, namesTop, LH);
            });
        }

        /* ---------- Dessin complet ---------- */
        const measureCtx = document.createElement('canvas').getContext('2d');

        function drawReport(canvas) {
            const { W, SCALE: S, PAD, GAP, COLS, HEADER_H } = REPORT;
            const LH = 11;

            // 1) Mise en forme des noms (retour à la ligne) -> hauteur des lignes de cartes
            const wrapped = battlesData.map(b => ({
                off: b.offense.map(n => wrapName(measureCtx, (n || '').trim(), 56)),
                def: b.defense.map(n => wrapName(measureCtx, (n || '').trim(), 56))
            }));
            const rows = Math.ceil(battlesData.length / COLS);
            const rowMaxLines = [];
            for (let r = 0; r < rows; r++) {
                let max = 1;
                wrapped.slice(r * COLS, (r + 1) * COLS).forEach(w => {
                    [...w.off, ...w.def].forEach(l => { max = Math.max(max, l.length); });
                });
                rowMaxLines.push(max);
            }
            const blockH = r => 72 + LH * rowMaxLines[r];
            const cardH = r => 46 + blockH(r) * 2 + 8 + 11;

            let H = HEADER_H;
            const rowY = [];
            for (let r = 0; r < rows; r++) { rowY.push(H); H += cardH(r) + (r < rows - 1 ? GAP : 0); }
            H += PAD;

            canvas.width = Math.round(W * S);
            canvas.height = Math.round(H * S);
            const ctx = canvas.getContext('2d');
            ctx.setTransform(S, 0, 0, S, 0, 0);
            ctx.clearRect(0, 0, W, H);

            // 2) Fond arrondi + motif de points
            ctx.save();
            roundRect(ctx, 0.5, 0.5, W - 1, H - 1, 16);
            ctx.fillStyle = COLORS.bg;
            ctx.fill();
            ctx.clip();
            ctx.fillStyle = COLORS.dot;
            for (let y = 12; y < H; y += 24) {
                for (let x = 12; x < W; x += 24) { ctx.beginPath(); ctx.arc(x, y, 1, 0, Math.PI * 2); ctx.fill(); }
            }
            ctx.restore();
            roundRect(ctx, 0.5, 0.5, W - 1, H - 1, 16);
            ctx.lineWidth = 1;
            ctx.strokeStyle = COLORS.border;
            ctx.stroke();

            // 3) En-tête
            const logo = getImage(LOGO_URL);
            fillStrokeRect(ctx, PAD, PAD, 40, 40, 8, COLORS.slate800, null);
            if (logo && logo.state === 'ok') {
                ctx.save();
                roundRect(ctx, PAD, PAD, 40, 40, 8);
                ctx.clip();
                drawCover(ctx, logo.img, PAD, PAD, 40);
                ctx.restore();
            }
            drawText(ctx, 'SUMMONERS WAR', PAD + 52, PAD + 13, { size: 14, weight: 800, color: COLORS.white, spacing: 0.35 });
            drawText(ctx, 'COMPTE-RENDU SIÈGE', PAD + 52, PAD + 30, { size: 10, weight: 700, color: COLORS.amber, spacing: 1 });

            const wins = battlesData.filter(b => b.result === 'win').length;
            const losses = battlesData.filter(b => b.result === 'loss').length;
            const scoreStr = `${wins} W - ${losses} L`;
            const g1 = guildName1.trim() || 'Guilde 1';
            const g2 = guildName2.trim() || 'Guilde 2';

            const BH = 32, BY = PAD + 4, BPAD = 14, BGAP = 8;
            const scoreOpt = { size: 12, weight: 900, color: COLORS.slate200 };
            const nameOpt = { size: 12, weight: 900, color: COLORS.amber };
            const vsOpt = { size: 10, weight: 700, color: COLORS.slate500 };
            const iconOpt = { size: 12, weight: 900, family: FA_FONT, color: COLORS.amber };

            const scoreW = measureText(ctx, scoreStr, scoreOpt) + BPAD * 2;
            const scoreX = W - PAD - scoreW;
            fillStrokeRect(ctx, scoreX, BY, scoreW, BH, 12, COLORS.slate900, COLORS.slate800);
            drawText(ctx, scoreStr, scoreX + scoreW / 2, BY + BH / 2, { ...scoreOpt, align: 'center' });

            const iconW = measureText(ctx, FA_KHANDA, iconOpt);
            const g1W = measureText(ctx, g1, nameOpt);
            const vsW = measureText(ctx, 'VS', vsOpt);
            const g2W = measureText(ctx, g2, nameOpt);
            const guildW = BPAD * 2 + iconW + BGAP + g1W + BGAP + vsW + BGAP + g2W;
            const guildX = scoreX - 8 - guildW;
            fillStrokeRect(ctx, guildX, BY, guildW, BH, 12, COLORS.slate900, COLORS.slate800);
            let gx = guildX + BPAD;
            const cyBadge = BY + BH / 2;
            drawText(ctx, FA_KHANDA, gx, cyBadge, iconOpt); gx += iconW + BGAP;
            drawText(ctx, g1, gx, cyBadge, nameOpt); gx += g1W + BGAP;
            drawText(ctx, 'VS', gx, cyBadge, vsOpt); gx += vsW + BGAP;
            drawText(ctx, g2, gx, cyBadge, nameOpt);

            // séparateur
            ctx.fillStyle = 'rgba(30,41,59,0.8)';
            ctx.fillRect(PAD, PAD + 40 + 12, W - PAD * 2, 1);

            // 4) Cartes des combats
            const cardW = (W - PAD * 2 - GAP * (COLS - 1)) / COLS;
            battlesData.forEach((b, i) => {
                const col = i % COLS, row = Math.floor(i / COLS);
                const x = PAD + col * (cardW + GAP);
                const y = rowY[row];
                const h = cardH(row);
                const isWin = b.result === 'win';
                const rgb = isWin ? COLORS.winRgb : COLORS.lossRgb;
                const accent = isWin ? COLORS.win : COLORS.loss;

                fillStrokeRect(ctx, x, y, cardW, h, 12, 'rgba(15,23,42,0.9)', `rgba(${rgb},0.4)`);

                const ix = x + 11, iw = cardW - 22, midY = y + 21;
                const numTxt = `#${b.id}`;
                const numOpt = { size: 10, weight: 900, color: accent };
                const numW = measureText(ctx, numTxt, numOpt) + 16;
                fillStrokeRect(ctx, ix, y + 11, numW, 20, 4, `rgba(${rgb},0.2)`, `rgba(${rgb},0.3)`);
                drawText(ctx, numTxt, ix + numW / 2, midY, { ...numOpt, align: 'center' });
                drawText(ctx, isWin ? 'VICTOIRE' : 'DÉFAITE', ix + numW + 8, midY, { size: 11, weight: 800, color: accent, spacing: 0.3 });

                ctx.fillStyle = 'rgba(30,41,59,1)';
                ctx.fillRect(ix, y + 37, iw, 1);

                const bh = blockH(row);
                const top1 = y + 46;
                drawTeam(ctx, 'ATQ', b.offense, wrapped[i].off, ix, top1, iw, bh, LH);
                drawTeam(ctx, 'DEF', b.defense, wrapped[i].def, ix, top1 + bh + 8, iw, bh, LH);
            });
        }

        let renderQueued = false;
        function requestRender() {
            if (renderQueued) return;
            renderQueued = true;
            requestAnimationFrame(() => {
                renderQueued = false;
                const canvas = document.getElementById('report-canvas');
                if (canvas) drawReport(canvas);
            });
        }

        function renderReportCards() {
            requestRender();
        }

        function updateScoreBadge() {
            const wins = battlesData.filter(b => b.result === 'win').length;
            const losses = battlesData.filter(b => b.result === 'loss').length;

            document.getElementById('counter-win').innerText = wins;
            document.getElementById('counter-loss').innerText = losses;
            requestRender();
        }

        function prevBattle() {
            if (currentBattleIndex > 0) selectBattle(currentBattleIndex - 1);
        }

        function nextBattle() {
            if (currentBattleIndex < 9) selectBattle(currentBattleIndex + 1);
        }

        function resetAllData() {
            battlesData = Array.from({ length: 10 }, (_, i) => ({
                id: i + 1,
                result: 'win',
                offense: ['', '', ''],
                defense: ['', '', '']
            }));
            guildName1 = '';
            guildName2 = '';
            document.getElementById('guild-name-1-input').value = '';
            document.getElementById('guild-name-2-input').value = '';
            currentBattleIndex = 0;
            init();
            showToast('Toutes les données ont été réinitialisées');
        }

        async function exportAsPNG() {
            const canvas = document.getElementById('report-canvas');
            await loadFonts();
            drawReport(canvas);          // lance le chargement des images manquantes
            await waitForImages();
            drawReport(canvas);          // dessin final, tout est chargé

            canvas.toBlob(blob => {
                if (!blob) { showToast("Export impossible, réessaie dans un instant"); return; }
                const url = URL.createObjectURL(blob);
                const link = document.createElement('a');
                link.download = 'compte-rendu-sw.png';
                link.href = url;
                link.click();
                setTimeout(() => URL.revokeObjectURL(url), 1000);
            }, 'image/png');
        }

        function showToast(msg) {
            const toast = document.getElementById('toast');
            document.getElementById('toast-message').innerText = msg;
            toast.classList.remove('translate-y-20', 'opacity-0', 'pointer-events-none');
            setTimeout(() => {
                toast.classList.add('translate-y-20', 'opacity-0', 'pointer-events-none');
            }, 3000);
        }

        window.onload = async () => {
            init();
            await loadFonts();
            requestRender();
        };
    </script>
</body>
