<!DOCTYPE html>
<html lang="fr" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#060815">
    <title>Compte-Rendu Summoners War - Format Paysage</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;900&family=Nunito:wght@500;600;700;800;900&display=swap" rel="stylesheet">


    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Nunito', 'sans-serif'],
                        display: ['Cinzel', 'serif'],
                    },
                    colors: {
                        swgt: {
                            gold: '#f0bf55',
                            dark: '#060815',
                            card: '#131a38',
                        }
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="style.css">
</head>
<body class="min-h-screen flex flex-col">

    <!-- En-tête -->
    <header class="sw-header sticky top-0 z-40">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <img src="https://i.imgur.com/3FQVVBq.png" alt="Logo" class="logo-frame w-14 h-14 object-cover">
                <div>
                    <h1 class="brand-title leading-tight">SW Strategist</h1>
                    <p class="text-[11px] font-semibold" style="color: var(--mist);">Compte-Rendu Siège</p>
                </div>
            </div>
            <div class="flex items-center gap-3">
                <button onclick="resetAllData()" class="btn btn-danger">
                    <i class="fa-solid fa-trash-can"></i>
                    <span>Effacer Tout</span>
                </button>
                <button onclick="exportAsPNG()" class="btn btn-gold">
                    <i class="fa-solid fa-file-image"></i>
                    <span>Télécharger PNG</span>
                </button>
            </div>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 my-6 flex-1 w-full space-y-6">

        <!-- SECTION 1 : ÉDITEUR DU COMBAT (HAUT) -->
        <div id="panel-editor" class="sw-frame p-5 space-y-4">

            <!-- Noms des Guildes & Score -->
            <div class="grid grid-cols-1 md:grid-cols-12 gap-4 items-center">
                <div class="md:col-span-8 grid grid-cols-1 sm:grid-cols-2 gap-3">
                    <div>
                        <label for="guild-name-1-input" class="sw-label">
                            <i class="fa-solid fa-shield"></i> Guilde Adverse 1
                        </label>
                        <input type="text" id="guild-name-1-input" placeholder="Nom Guilde 1..." oninput="onGuildInput()" class="sw-input w-full px-3 py-1.5 text-xs">
                    </div>
                    <div>
                        <label for="guild-name-2-input" class="sw-label">
                            <i class="fa-solid fa-shield"></i> Guilde Adverse 2
                        </label>
                        <input type="text" id="guild-name-2-input" placeholder="Nom Guilde 2..." oninput="onGuildInput()" class="sw-input w-full px-3 py-1.5 text-xs">
                    </div>
                </div>

                <div class="md:col-span-4 flex justify-end items-center">
                    <div class="score-plate px-4 py-2 w-full sm:w-auto text-center">
                        <span class="score-label">Score Total:</span>
                        <span id="counter-win" class="num-win">0</span>&thinsp;V - 
                        <span id="counter-loss" class="num-loss">0</span>&thinsp;D
                    </div>
                </div>
            </div>

            <!-- Pastilles de sélection des 10 combats -->
            <div class="sw-inset p-2.5">
                <div id="pills-container" class="grid grid-cols-5 sm:grid-cols-10 gap-1.5">
                    <!-- Généré dynamiquement -->
                </div>
            </div>

            <!-- Formulaire d'édition du combat sélectionné -->
            <div class="sw-inset p-4 space-y-4">
                <div class="flex items-center justify-between sw-rule pb-3">
                    <h2 class="edit-heading">
                        <span class="battle-num" id="current-battle-num">1</span>
                        Édition Combat <span id="current-battle-title" class="ml-1" style="color: var(--mist);">#1</span>
                    </h2>

                    <div class="seg">
                        <button id="btn-res-win" onclick="setResult('win')" class="seg-btn"><i class="fa-solid fa-trophy"></i> Victoire</button>
                        <button id="btn-res-loss" onclick="setResult('loss')" class="seg-btn"><i class="fa-solid fa-xmark"></i> Défaite</button>
                    </div>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <!-- Attaque -->
                    <div class="team-panel p-3">
                        <span class="team-title"><i class="fa-solid fa-khanda"></i> Attaque (3 Monstres)</span>
                        <div id="offense-monsters-form" class="space-y-2"></div>
                    </div>

                    <!-- Défense -->
                    <div class="team-panel p-3">
                        <span class="team-title"><i class="fa-solid fa-shield-halved"></i> Défense Adverse (3 Monstres)</span>
                        <div id="defense-monsters-form" class="space-y-2"></div>
                    </div>
                </div>

                <div class="flex justify-between items-center pt-2">
                    <button onclick="prevBattle()" class="btn btn-stone">
                        <i class="fa-solid fa-chevron-left"></i> Précédent
                    </button>
                    <button onclick="nextBattle()" class="btn btn-gold">
                        Suivant <i class="fa-solid fa-chevron-right"></i>
                    </button>
                </div>
            </div>

        </div>

        <!-- SECTION 2 : COMPTE-RENDU VISUEL (dessiné en canvas : l'aperçu = le PNG exporté) -->
        <div id="panel-preview" class="w-full overflow-x-auto pb-4">
            <div class="min-w-[1050px]">
                <canvas id="report-canvas" width="2272" height="1216" class="block w-full h-auto rounded-xl" aria-label="Compte-rendu du siège"></canvas>
            </div>
        </div>

    </main>

    <!-- Toast Notification -->
    <div id="toast" class="sw-toast fixed bottom-5 right-5 px-4 py-2.5 rounded-xl shadow-2xl flex items-center space-x-2 transform translate-y-20 opacity-0 pointer-events-none z-50 transition-all duration-300">
        <i id="toast-icon" class="fa-solid fa-circle-check" style="color: var(--win);"></i>
        <span id="toast-message" class="text-xs font-semibold">Notification</span>
    </div>


    <script src="monsters.js"></script>
    <script src="app.js"></script>
</body>
</html>
